[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcn"
version = "1.0.0"
description = "Logical Credal Networks"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "networkx>=3.7",
    "pyomo>=6.10.1",
    "pyagrum>=3.3.2",
    "tqdm>=4.70.1",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
# Experiment runners / result plotting (experiments/plot_results.py).
experiments = [
    "pandas>=3.1.1",
]
# Demo notebooks under notebooks/.
notebooks = [
    "ipykernel>=7.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pandas>=3.1.1",
    "ipykernel>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lcn"]

[project.urls]
Source = "https://github.ibm.com/IBM-Research-AI/LCN"