[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcn"
version = "1.0.0"
description = "Logical Credal Networks"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    # TODO: loosen dependencies
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "tqdm",
    "matplotlib",
    "networkx",
    "ipykernel",
    "ipywidgets",
    "pyomo",
    "gravis",
    # gravis 0.1.0 imports the legacy `pkg_resources` module, which setuptools
    # removed in 80.0. Pin setuptools to the last series that still ships it so
    # `import gravis` works (the notebooks use gravis for graph visualization).
    "setuptools<80",
    "pytest",
    "pyagrum>=2.3.2"
]

[tool.hatch.build.targets.wheel]
packages = ["lcn"]

[project.urls]
Source = "https://github.ibm.com/IBM-Research-AI/LCN"